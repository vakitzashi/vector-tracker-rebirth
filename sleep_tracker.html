<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник сна</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');

        :root {
            --bg-dark: #0f172a;
            --accent: #818cf8;
            --card-bg: #1e293b;
        }

        body {
            background-color: var(--bg-dark);
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            padding-bottom: 80px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .label {
            display: block;
            font-size: 0.875rem;
            font-weight: 500;
            margin-bottom: 12px;
            color: #94a3b8;
        }

        .clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(15, 23, 42, 0.5);
            padding: 15px;
            border-radius: 16px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .clock-container:hover {
            border-color: var(--accent);
            background: rgba(129, 140, 248, 0.1);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 3px;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            margin-top: -8px;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #334155;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked+.slider {
            background-color: var(--accent);
        }

        input:checked+.slider:before {
            transform: translateX(26px);
        }

        .indicator-box {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
        }

        .value-badge {
            background: var(--accent);
            color: white;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.9rem;
            min-width: 32px;
            text-align: center;
            animation: pop-in 0.2s ease-out;
        }

        @keyframes pop-in {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .btn-action {
            background: #334155;
            color: white;
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-action:active {
            background: var(--accent);
        }

        .voice-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .voice-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: #334155;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .voice-btn:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .voice-btn.recording {
            background: #dc2626;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.2);
        }

        .voice-status {
            min-height: 18px;
            margin-top: 8px;
            color: #94a3b8;
            font-size: 0.75rem;
        }

        .btn-submit {
            background: linear-gradient(135deg, #818cf8 0%, #6366f1 100%);
            width: 100%;
            padding: 18px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 1.1rem;
            box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.4);
            transition: all 0.3s;
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        input[type="text"],
        textarea,
        input[type="date"],
        input[type="number"] {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 12px;
            color: white;
            width: 100%;
            outline: none;
        }

        .dream-type-selector {
            display: flex;
            background: rgba(15, 23, 42, 0.5);
            padding: 4px;
            border-radius: 14px;
            margin-top: 15px;
            border: 1px solid #334155;
            display: none;
        }

        .dream-option {
            flex: 1;
            text-align: center;
            padding: 10px 5px;
            cursor: pointer;
            border-radius: 10px;
            font-size: 0.75rem;
            transition: all 0.2s;
            color: #94a3b8;
        }

        .dream-option.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .dream-option span {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 2px;
        }

        .clock-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .clock-picker-box {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 32px;
            text-align: center;
            width: 340px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        canvas {
            cursor: crosshair;
            touch-action: none;
        }

        .mode-toggle {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .mode-toggle.hidden {
            display: none;
        }

        .mode-btn {
            padding: 5px 15px;
            border-radius: 8px;
            font-weight: 600;
            color: #94a3b8;
            cursor: pointer;
        }

        .mode-btn.active {
            color: var(--accent);
            background: rgba(129, 140, 248, 0.1);
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 1.2rem;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .temp-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .temp-picker-box {
            background: var(--card-bg);
            padding: 24px;
            border-radius: 32px;
            text-align: center;
            width: 340px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .temp-display {
            font-size: 4rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 30px;
            min-height: 80px;
            font-family: 'Courier New', monospace;
        }

        .numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .numpad-btn {
            padding: 20px;
            background: #334155;
            border: 1px solid #475569;
            border-radius: 12px;
            color: white;
            font-size: 1.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .numpad-btn:active {
            background: var(--accent);
            transform: scale(0.95);
        }

        .numpad-btn:hover {
            background: #475569;
        }

        .temp-actions {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }

        .temp-actions button {
            flex: 1;
            padding: 12px;
            border-radius: 12px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }

        .temp-actions .btn-cancel {
            background: #334155;
            color: white;
        }

        .temp-actions .btn-confirm {
            background: var(--accent);
            color: white;
        }

        .temp-actions .btn-delete {
            background: #64748b;
            color: white;
            padding: 12px 20px;
        }
    </style>
</head>

<body>

    <div class="app-container">
        <div class="header">
            <a href="index.html" class="back-btn">←</a>
            <h1 class="text-3xl font-bold tracking-tight">Дневник сна 🌙</h1>
        </div>

        <div class="card">
            <label class="label">Дата записи</label>
            <input type="date" id="sleepDate">
        </div>

        <div class="card">
            <h2 class="text-lg font-semibold mb-4 text-indigo-300">Расписание</h2>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div class="clock-container" onclick="openClock('bedTime')">
                    <span class="label">Лёг в постель</span>
                    <div id="bedTimeDisplay" class="text-xl font-bold">22:00</div>
                </div>
                <div class="clock-container" onclick="openClock('lightOffTime')">
                    <span class="label">Выключил свет</span>
                    <div id="lightOffTimeDisplay" class="text-xl font-bold">22:00</div>
                </div>
                <div class="clock-container" onclick="openClock('wakeUpTime')">
                    <span class="label">Проснулся</span>
                    <div id="wakeUpTimeDisplay" class="text-xl font-bold">07:30</div>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 class="text-lg font-semibold mb-4 text-indigo-300">Температура</h2>
            <div class="grid grid-cols-2 gap-4">
                <div class="clock-container" onclick="openTempPicker('tempMorning')">
                    <span class="label">🌡️ t - утром</span>
                    <div id="tempMorningDisplay" class="text-xl font-bold">22</div>
                </div>
                <div class="clock-container" onclick="openTempPicker('tempEvening')">
                    <span class="label">🌡️ t - вечером</span>
                    <div id="tempEveningDisplay" class="text-xl font-bold">19</div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="mb-6">
                <div class="flex justify-between items-center mb-2">
                    <label class="label mb-0">Качество сна</label>
                    <div class="indicator-box">
                        <span id="qualityVal" class="value-badge">7</span>
                        <span id="qualityEmoji" class="text-2xl">🙂</span>
                    </div>
                </div>
                <input type="range" id="qualityRange" min="1" max="10" value="7" oninput="updateRange('quality')">
            </div>
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="label mb-0">Уровень энергии</label>
                    <div class="indicator-box">
                        <span id="energyVal" class="value-badge">7</span>
                        <span id="energyEmoji" class="text-2xl">🙂</span>
                    </div>
                </div>
                <input type="range" id="energyRange" min="1" max="10" value="7" oninput="updateRange('energy')">
            </div>
        </div>

        <div class="card">
            <div class="flex justify-between items-center">
                <label class="label mb-0">Пробуждения ночью</label>
                <div class="flex items-center gap-4">
                    <button class="btn-action" onclick="changeAwakening(-1)">−</button>
                    <span id="awakeningsCount" class="text-2xl font-bold text-indigo-400">0</span>
                    <button class="btn-action" onclick="changeAwakening(1)">+</button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <label class="label mb-1">Снились ли сны?</label>
                    <span id="dreamsEmoji" class="text-2xl">😑</span>
                </div>
                <label class="toggle-switch">
                    <input type="checkbox" id="dreamsToggle" onchange="updateDreamsUI()">
                    <span class="slider"></span>
                </label>
            </div>

            <div id="dreamTypeSelector" class="dream-type-selector">
                <div class="dream-option" onclick="setDreamType('Кошмары')">
                    <span>👿</span>Кошмары
                </div>
                <div class="dream-option active" onclick="setDreamType('Нейтральный')">
                    <span>😏</span>Нейтральный
                </div>
                <div class="dream-option" onclick="setDreamType('Приятный')">
                    <span>😇</span>Приятный
                </div>
            </div>

            <div class="input-group mt-6">
                <div class="voice-row">
                    <label class="label mb-0" for="comment">Комментарии</label>
                    <button type="button" class="voice-btn" id="voiceBtn" onclick="toggleVoiceInput()" title="Голосовой ввод" aria-label="Голосовой ввод">🎙</button>
                </div>
                <textarea id="comment" rows="3" placeholder="Спорт, алкоголь, стресс..."></textarea>
                <div class="voice-status" id="voiceStatus"></div>
            </div>
        </div>

        <button class="btn-submit text-white" id="submitBtn" onclick="submitDiary()">ЗАПИСАТЬ ДАННЫЕ</button>
    </div>

    <div id="tempModal" class="temp-modal">
        <div class="temp-picker-box">
            <div class="temp-display" id="tempDisplay">0</div>
            <div class="numpad">
                <button class="numpad-btn" onclick="addTempDigit('1')">1</button>
                <button class="numpad-btn" onclick="addTempDigit('2')">2</button>
                <button class="numpad-btn" onclick="addTempDigit('3')">3</button>
                <button class="numpad-btn" onclick="addTempDigit('4')">4</button>
                <button class="numpad-btn" onclick="addTempDigit('5')">5</button>
                <button class="numpad-btn" onclick="addTempDigit('6')">6</button>
                <button class="numpad-btn" onclick="addTempDigit('7')">7</button>
                <button class="numpad-btn" onclick="addTempDigit('8')">8</button>
                <button class="numpad-btn" onclick="addTempDigit('9')">9</button>
                <button class="numpad-btn" onclick="addTempDigit('.')">.</button>
                <button class="numpad-btn" onclick="addTempDigit('0')">0</button>
                <button class="numpad-btn temp-actions" onclick="clearTemp()" style="grid-column: span 1; padding: 20px;">←</button>
            </div>
            <div class="temp-actions">
                <button class="btn-cancel" onclick="closeTempModal(false)">ОТМЕНА</button>
                <button class="btn-confirm" onclick="closeTempModal(true)">ГОТОВО</button>
            </div>
        </div>
    </div>
    <div id="clockModal" class="clock-modal">
        <div class="clock-picker-box">
            <div class="mode-toggle">
                <span id="btnModeHours" class="mode-btn active" onclick="switchPickerMode('hours')">ЧАСЫ</span>
                <span class="text-slate-600">|</span>
                <span id="btnModeMinutes" class="mode-btn" onclick="switchPickerMode('minutes')">МИНУТЫ</span>
            </div>
            <div class="text-5xl font-mono mb-6 text-indigo-400" id="clockTimePreview">22:00</div>
            <canvas id="clockCanvas" width="300" height="300"></canvas>
            <div class="mt-8 flex justify-center gap-4">
                <button class="btn-action w-full bg-slate-700" onclick="closeClock(false)">ОТМЕНА</button>
                <button class="btn-action w-full bg-indigo-500" onclick="closeClock(true)">ГОТОВО</button>
            </div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycby-mc7pqRm_eXKdRl70N9YUF-G7BwfB4cy3cFhDmBRaPObnG289Z96GfRi0ubBrsZWdiw/exec';

        const state = {
            times: { bedTime: "22:00", lightOffTime: "22:00", wakeUpTime: "07:30" },
            temps: { tempMorning: 36.6, tempEvening: 36.6 },
            activeId: null, tempH: 22, tempM: 0, mode: 'hours', isDragging: false,
            awakenings: 0,
            dreamType: 'Нейтральный',
            isTemperatureMode: false,
            currentTemp: 36.6,
            recognition: null,
            isRecognizing: false,
            voiceInputActive: false
        };

        document.getElementById('sleepDate').valueAsDate = new Date();

        initVoiceInput();

        function initVoiceInput() {
            const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const btn = document.getElementById('voiceBtn');
            const status = document.getElementById('voiceStatus');

            if (!Recognition) {
                btn.disabled = true;
                status.innerText = 'Голосовой ввод не поддерживается в этом браузере';
                return;
            }

            const recognition = new Recognition();
            recognition.lang = 'ru-RU';
            recognition.interimResults = false;
            recognition.continuous = true;

            recognition.onstart = () => {
                state.isRecognizing = true;
                btn.classList.add('recording');
                status.innerText = 'Слушаю...';
            };

            recognition.onresult = (event) => {
                const text = Array.from(event.results)
                    .map(result => result[0].transcript)
                    .join(' ')
                    .trim();

                if (text) {
                    const comment = document.getElementById('comment');
                    const prefix = comment.value.trim() ? ' ' : '';
                    comment.value = `${comment.value}${prefix}${text}`;
                    status.innerText = 'Текст добавлен';
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                    state.voiceInputActive = false;
                    status.innerText = 'Нет доступа к микрофону';
                    return;
                }

                if (event.error !== 'no-speech' && event.error !== 'aborted') {
                    status.innerText = 'Не удалось распознать речь';
                }
            };

            recognition.onend = () => {
                state.isRecognizing = false;

                if (state.voiceInputActive) {
                    status.innerText = 'Слушаю...';
                    setTimeout(() => {
                        if (state.voiceInputActive && !state.isRecognizing) {
                            startVoiceRecognition();
                        }
                    }, 250);
                    return;
                }

                btn.classList.remove('recording');
                status.innerText = '';
            };

            state.recognition = recognition;
        }

        function startVoiceRecognition() {
            try {
                state.recognition.start();
            } catch (error) {
                state.isRecognizing = false;
            }
        }

        function toggleVoiceInput() {
            if (!state.recognition) return;

            if (state.voiceInputActive) {
                state.voiceInputActive = false;
                state.recognition.stop();
            } else {
                state.voiceInputActive = true;
                document.getElementById('voiceBtn').classList.add('recording');
                document.getElementById('voiceStatus').innerText = 'Слушаю...';
                startVoiceRecognition();
            }
        }

        function updateRange(type) {
            const val = document.getElementById(type + 'Range').value;
            const emojiEl = document.getElementById(type + 'Emoji');
            const valEl = document.getElementById(type + 'Val');

            valEl.innerText = val;
            valEl.style.animation = 'none';
            void valEl.offsetWidth;
            valEl.style.animation = 'pop-in 0.2s ease-out';

            emojiEl.innerText = val <= 3 ? "😴" : val <= 6 ? "🥱" : val <= 9 ? "🙂" : "🤩";
        }

        function updateDreamsUI() {
            const checked = document.getElementById('dreamsToggle').checked;
            const emojiEl = document.getElementById('dreamsEmoji');
            const selectorEl = document.getElementById('dreamTypeSelector');

            emojiEl.innerText = checked ? "😵‍💫" : "😑";
            selectorEl.style.display = checked ? "flex" : "none";
        }

        function setDreamType(type) {
            state.dreamType = type;
            const options = document.querySelectorAll('.dream-option');
            options.forEach(opt => {
                if (opt.innerText.includes(type)) opt.classList.add('active');
                else opt.classList.remove('active');
            });
        }

        function changeAwakening(delta) {
            state.awakenings = Math.max(0, state.awakenings + delta);
            document.getElementById('awakeningsCount').innerText = state.awakenings;
        }

        const canvas = document.getElementById('clockCanvas');
        const ctx = canvas.getContext('2d');
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;
        const outerR = 125; const innerR = 85; const minuteR = 120;

        function openClock(id) {
            state.activeId = id;
            const [h, m] = state.times[id].split(':').map(Number);
            state.tempH = h; state.tempM = m; state.mode = 'hours';
            document.getElementById('clockModal').style.display = 'flex';
            updateUI(); draw();
        }

        function openTempPicker(id) {
            state.activeId = id;
            state.isTemperatureMode = true;
            state.currentTemp = String(state.temps[id]);
            document.getElementById('tempDisplay').innerText = state.currentTemp;
            document.getElementById('tempModal').style.display = 'flex';
        }

        function switchPickerMode(m) { 
            state.mode = m; 
            updateUI(); 
            draw();
        }

        function updateUI() {
            document.getElementById('clockTimePreview').innerText = `${String(state.tempH).padStart(2, '0')}:${String(state.tempM).padStart(2, '0')}`;
            document.getElementById('btnModeHours').className = `mode-btn ${state.mode === 'hours' ? 'active' : ''}`;
            document.getElementById('btnModeMinutes').className = `mode-btn ${state.mode === 'minutes' ? 'active' : ''}`;
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath(); ctx.arc(cx, cy, outerR + 15, 0, Math.PI * 2); ctx.fillStyle = '#1e293b'; ctx.fill();
            if (state.mode === 'hours') {
                drawNumbers(13, 24, outerR, state.tempH);
                drawNumbers(1, 12, innerR, state.tempH);
            } else {
                drawNumbers(0, 59, minuteR, state.tempM);
            }
            let angle, r;
            if (state.mode === 'hours') {
                r = (state.tempH >= 13 || state.tempH === 0) ? outerR : innerR;
                angle = ((state.tempH % 12) * 30 - 90) * (Math.PI / 180);
            } else {
                r = minuteR; angle = (state.tempM * 6 - 90) * (Math.PI / 180);
            }
            const tx = cx + r * Math.cos(angle); const ty = cy + r * Math.sin(angle);
            ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(tx, ty); ctx.strokeStyle = '#818cf8'; ctx.lineWidth = 2; ctx.stroke();
            ctx.beginPath(); ctx.arc(tx, ty, 18, 0, Math.PI * 2); ctx.fillStyle = 'rgba(129, 140, 248, 0.4)'; ctx.fill();
        }

        function drawNumbers(start, end, r, current) {
            ctx.font = '14px Inter'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            for (let i = 1; i <= 12; i++) {
                let val;
                if (state.mode === 'hours') {
                    val = (start === 13) ? (i + 12) : i; if (val === 24) val = 0;
                } else { val = (i * 5) % 60; }
                const angle = (i * 30 - 90) * (Math.PI / 180);
                const x = cx + r * Math.cos(angle); const y = cy + r * Math.sin(angle);
                const isSelected = (current === val);
                if (isSelected) {
                    ctx.beginPath(); ctx.arc(x, y, 14, 0, Math.PI * 2); ctx.fillStyle = '#818cf8'; ctx.fill(); ctx.fillStyle = '#fff';
                } else { ctx.fillStyle = '#64748b'; }
                ctx.fillText(val.toString().padStart(state.mode === 'minutes' ? 2 : 1, '0'), x, y);
            }
        }

        function handleInput(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = clientX - rect.left; const y = clientY - rect.top;
            const dx = x - cx; const dy = y - cy; const dist = Math.sqrt(dx * dx + dy * dy);
            let angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
            if (angle < 0) angle += 360;
            if (state.mode === 'hours') {
                let h = Math.round(angle / 30) % 12;
                if (dist > (innerR + outerR) / 2) state.tempH = h === 0 ? 0 : h + 12;
                else state.tempH = h === 0 ? 12 : h;
            } else { state.tempM = Math.round(angle / 6) % 60; }
            updateUI(); draw();
        }

        canvas.addEventListener('mousedown', (e) => { state.isDragging = true; handleInput(e); });
        window.addEventListener('mousemove', (e) => { if (state.isDragging) handleInput(e); });
        window.addEventListener('mouseup', () => { if (state.isDragging) { state.isDragging = false; if (state.mode === 'hours') setTimeout(() => switchPickerMode('minutes'), 300); } });

        function updateTempUI() {
            document.getElementById('clockTimePreview').innerText = state.currentTemp.toFixed(1) + '°C';
            document.querySelector('.mode-toggle').classList.add('hidden');
        }

        function drawTemp() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.beginPath(); 
            ctx.arc(cx, cy, outerR + 15, 0, Math.PI * 2); 
            ctx.fillStyle = '#1e293b'; 
            ctx.fill();
            
            ctx.font = '14px Inter'; 
            ctx.textAlign = 'center'; 
            ctx.textBaseline = 'middle';
            
            for (let i = 0; i < 9; i++) {
                const tempVal = 35 + i * 0.5;
                const angle = (i * 40 - 90) * (Math.PI / 180);
                const r = minuteR;
                const x = cx + r * Math.cos(angle); 
                const y = cy + r * Math.sin(angle);
                const isSelected = (Math.abs(state.currentTemp - tempVal) < 0.1);
                
                if (isSelected) {
                    ctx.beginPath(); 
                    ctx.arc(x, y, 14, 0, Math.PI * 2); 
                    ctx.fillStyle = '#818cf8'; 
                    ctx.fill(); 
                    ctx.fillStyle = '#fff';
                } else { 
                    ctx.fillStyle = '#64748b'; 
                }
                ctx.fillText(tempVal.toFixed(1), x, y);
            }
            
            const angle = ((state.currentTemp - 35) * 8 - 90) * (Math.PI / 180);
            const r = minuteR;
            const tx = cx + r * Math.cos(angle); 
            const ty = cy + r * Math.sin(angle);
            
            ctx.beginPath(); 
            ctx.moveTo(cx, cy); 
            ctx.lineTo(tx, ty); 
            ctx.strokeStyle = '#818cf8'; 
            ctx.lineWidth = 2; 
            ctx.stroke();
            
            ctx.beginPath(); 
            ctx.arc(tx, ty, 18, 0, Math.PI * 2); 
            ctx.fillStyle = 'rgba(129, 140, 248, 0.4)'; 
            ctx.fill();
        }

        function handleTempInput(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = clientX - rect.left; 
            const y = clientY - rect.top;
            const dx = x - cx; 
            const dy = y - cy;
            let angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
            if (angle < 0) angle += 360;
            
            const tempValue = (angle / 40) + 35;
            state.currentTemp = Math.max(35, Math.min(39, Math.round(tempValue * 2) / 2));
            updateTempUI(); 
            drawTemp();
        }

        function addTempDigit(digit) {
            if (state.currentTemp === '0' && digit !== '.') {
                state.currentTemp = digit;
            } else if (digit === '.') {
                if (!state.currentTemp.includes('.')) {
                    state.currentTemp += digit;
                }
            } else {
                state.currentTemp += digit;
            }
            document.getElementById('tempDisplay').innerText = state.currentTemp;
        }

        function clearTemp() {
            state.currentTemp = '0';
            document.getElementById('tempDisplay').innerText = state.currentTemp;
        }

        function closeTempModal(save) {
            if (save) {
                const tempValue = parseFloat(state.currentTemp) || 0;
                state.temps[state.activeId] = tempValue;
                document.getElementById(state.activeId + 'Display').innerText = tempValue.toFixed(1);
            }
            document.getElementById('tempModal').style.display = 'none';
            state.isTemperatureMode = false;
        }

        function closeClock(save) {
            if (save) {
                const timeStr = `${String(state.tempH).padStart(2, '0')}:${String(state.tempM).padStart(2, '0')}`;
                state.times[state.activeId] = timeStr;
                document.getElementById(state.activeId + 'Display').innerText = timeStr;
            }
            document.getElementById('clockModal').style.display = 'none';
        }

        async function submitDiary() {
            const btn = document.getElementById('submitBtn');
            const hasDreams = document.getElementById('dreamsToggle').checked;

            const payload = {
                type: 'sleep',
                date: document.getElementById('sleepDate').value,
                bedTime: state.times.bedTime,
                lightOffTime: state.times.lightOffTime,
                wakeUpTime: state.times.wakeUpTime,
                quality: parseInt(document.getElementById('qualityRange').value),
                energy: parseInt(document.getElementById('energyRange').value),
                awakeningCount: state.awakenings,
                dreams: hasDreams ? "Да" : "Нет",
                dreamType: hasDreams ? state.dreamType : "",
                tempEvening: parseFloat(state.temps.tempEvening),
                tempMorning: parseFloat(state.temps.tempMorning),
                comment: document.getElementById('comment').value
            };

            btn.disabled = true;
            btn.innerText = "ОТПРАВКА...";

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'text/plain;charset=utf-8'
                    },
                    body: JSON.stringify(payload)
                });

                btn.innerText = "ЗАПИСАНО! ✅";
                btn.classList.add('bg-green-600');
                setTimeout(() => {
                    btn.innerText = "ЗАПИСАТЬ ДАННЫЕ";
                    btn.classList.remove('bg-green-600');
                    btn.disabled = false;
                }, 3000);

            } catch (e) {
                console.error(e);
                btn.innerText = "ОШИБКА ❌";
                setTimeout(() => {
                    btn.innerText = "ЗАПИСАТЬ ДАННЫЕ";
                    btn.disabled = false;
                }, 3000);
            }
        }
    </script>
</body>
